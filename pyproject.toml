[project]
name = "code-data-factory"
version = "0.1.0"
description = "Traceable Agent trajectory data engineering"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.12.5,<3",
  "pyarrow>=23.0.1,<24",
  "PyYAML>=6.0.3,<7",
]

[project.scripts]
cdf = "code_data_factory.cli:main"

[dependency-groups]
data = [
  "datasketch>=1.9.0,<2",
  "duckdb>=1.5.0,<2",
  "dvc>=3.66.1,<4",
  "huggingface-hub>=1.3.0,<2",
  "ray[data]>=2.54.0,<3",
]
interaction = [
  "pint>=0.25.3,<1",
  "smolagents>=1.22.0,<2",
]
training = [
  "mlflow>=3.10.0,<4",
  "peft>=0.18.1,<1",
  "transformers>=5.3.0,<6",
  "trl>=0.29.0,<1",
]
dev = [
  "hatchling>=1.27,<2",
  "mypy>=1.18.2,<2",
  "pytest>=9.0.2,<10",
  "ruff>=0.14.7,<1",
  "types-PyYAML>=6.0.12.20250915,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "contract: deterministic offline contract tests",
  "real_resources: requires Linux, network, credentials, or other real resources",
]

[tool.uv]
default-groups = ["dev"]
package = true

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
