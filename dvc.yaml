stages:
  materialize_us1_inputs:
    cmd: >-
      uv run --group data cdf task build
      --config configs/tasks/pilot.yaml
      --output-dir data/build-inputs
    deps:
      - configs/tasks/pilot.yaml
      - src/code_data_factory/tasks/build.py
      - src/code_data_factory/tasks/splits.py
    outs:
      - data/build-inputs
  build_us1_local:
    cmd: >-
      uv run --group data cdf data build
      --input data/build-inputs/pilot.json
      --backend local
      --output-dir data/draft/local
    deps:
      - data/build-inputs/pilot.json
      - configs/quality/build.yaml
      - src/code_data_factory/cli.py
      - src/code_data_factory/datasets/build.py
      - src/code_data_factory/processing/backends.py
      - src/code_data_factory/processing/commit.py
      - src/code_data_factory/processing/dedup.py
      - src/code_data_factory/processing/quality.py
    outs:
      - data/draft/local
  build_us1_ray:
    cmd: >-
      uv run --group data cdf data build
      --input data/build-inputs/pilot.json
      --backend ray
      --output-dir data/draft/ray
    deps:
      - data/build-inputs/pilot.json
      - configs/quality/build.yaml
      - src/code_data_factory/cli.py
      - src/code_data_factory/datasets/build.py
      - src/code_data_factory/processing/backends.py
      - src/code_data_factory/processing/commit.py
      - src/code_data_factory/processing/dedup.py
      - src/code_data_factory/processing/quality.py
    outs:
      - data/draft/ray
