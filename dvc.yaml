stages:
  materialize_us1_inputs:
    cmd: >-
      uv run --group data cdf task build
      --config configs/tasks/pilot.yaml
      --output-dir data/build-inputs
    deps:
      - configs/tasks/pilot.yaml
      - src/code_data_factory/tasks/build.py
      - src/code_data_factory/tasks/splits.py
    outs:
      - data/build-inputs
  build_us1_local:
    cmd: >-
      uv run --group data cdf data build
      --input data/build-inputs/pilot.json
      --backend local
      --output-dir data/draft/local
    deps:
      - data/build-inputs/pilot.json
      - configs/quality/build.yaml
      - src/code_data_factory/cli.py
      - src/code_data_factory/datasets/build.py
      - src/code_data_factory/processing/backends.py
      - src/code_data_factory/processing/commit.py
      - src/code_data_factory/processing/dedup.py
      - src/code_data_factory/processing/quality.py
    outs:
      - data/draft/local
  build_us1_ray:
    cmd: >-
      uv run --group data cdf data build
      --input data/build-inputs/pilot.json
      --backend ray
      --output-dir data/draft/ray
    deps:
      - data/build-inputs/pilot.json
      - configs/quality/build.yaml
      - src/code_data_factory/cli.py
      - src/code_data_factory/datasets/build.py
      - src/code_data_factory/processing/backends.py
      - src/code_data_factory/processing/commit.py
      - src/code_data_factory/processing/dedup.py
      - src/code_data_factory/processing/quality.py
    outs:
      - data/draft/ray
  build_external_ray:
    cmd: >-
      uv run --group data cdf data build
      --input data/build-inputs/external.json
      --backend ray
      --output-dir data/candidates/external
    deps:
      - data/build-inputs/external.json
      - configs/quality/external-sft.yaml
      - src/code_data_factory/cli.py
      - src/code_data_factory/datasets/build.py
      - src/code_data_factory/datasets/build_input.py
      - src/code_data_factory/processing/quality.py
    outs:
      - data/candidates/external
  publish_external:
    cmd: >-
      uv run --group data cdf dataset publish
      --draft data/candidates/external/membership.json
      --config configs/quality/external-sft.yaml
      --output-dir data/releases
    deps:
      - data/candidates/external/membership.json
      - configs/quality/external-sft.yaml
      - src/code_data_factory/cli.py
      - src/code_data_factory/datasets/publish.py
    outs:
      - data/releases/external
  export_external_sft:
    cmd: >-
      uv run --group training cdf dataset export-sft
      --dataset data/candidates/external/membership.json
      --config configs/experiments/export-sft.yaml
      --output-dir data/exports/external
    deps:
      - data/candidates/external/membership.json
      - configs/experiments/export-sft.yaml
      - src/code_data_factory/cli.py
      - src/code_data_factory/datasets/export_sft.py
    outs:
      - data/exports/external
